<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>clear your mind.</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%231a6b5a'/><rect x='7' y='7.5' width='18' height='4.5' rx='2.25' fill='%23ffffff'/><rect x='7' y='13.75' width='13' height='4.5' rx='2.25' fill='%238fd6bf'/><rect x='7' y='20' width='8' height='4.5' rx='2.25' fill='%23e6f1ec' fill-opacity='.55'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Onest:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --page: #f4f8f4;
      --card: #ffffff;
      --line: #e0e7e0;
      --control: #d9e0d9;
      --ink: #161513;
      --body: #3a3833;
      --meta: #77746b;
      --faint: #99968c;
      --green: #1a6b5a;
      --mint: #8fd6bf;
      --green-tint: #e6f1ec;
      --task: #e1f9fa;
      --later: #fff0e3;
      --letgo: #feeefc;
      --track: #eeece6;
      --glass: rgba(255, 255, 255, .7);
      --serif: 'Young Serif', Georgia, serif;
      --sans: 'Onest', Helvetica, Arial, sans-serif;
      --mono: 'Geist Mono', ui-monospace, SFMono-Regular, monospace;
      --rise: cubic-bezier(.2, .7, .2, 1);
    }
    * { box-sizing: border-box; text-wrap: pretty; }
    html, body { margin: 0; }
    body { background: var(--page); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    a, .link { color: var(--green); }
    .link { background: none; border: 0; padding: 0; font: 400 14px/1 var(--sans); white-space: nowrap; }
    .link:hover, a:hover { color: var(--ink); }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

    .rise { animation: rise .5s var(--rise) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; } .fill { transition: none !important; } }

    /* ── shell ─────────────────────────────────────────── */
    .top { display: flex; align-items: center; gap: 12px; padding: 64px 22px 0; }
    .brand { font: 400 17px/1 var(--serif); color: var(--green); }
    .streak { margin-left: auto; font: 400 11.5px/1.45 var(--mono); color: var(--meta); white-space: nowrap; }
    .streak .long { display: none; }

    /* ── pills ─────────────────────────────────────────── */
    .tint { font: 400 13px/1 var(--sans); padding: 8px 12px; border-radius: 999px; border: 0; background: var(--green-tint); color: var(--green); }
    .pill { font: 500 14px/1 var(--sans); padding: 10px 16px; border-radius: 999px; border: 1px solid var(--control); background: var(--card); color: var(--body); }
    .pill[aria-pressed="true"] { background: var(--green-tint); border-color: var(--green); color: var(--green); }
    .pill.sm { font: 400 13px/1 var(--sans); padding: 8px 14px; }
    .pill.xs { font: 400 12px/1 var(--sans); padding: 5px 10px; }
    .primary { height: 54px; border: 0; border-radius: 999px; background: var(--green); color: #fff; font: 500 16px/1 var(--sans); }
    .primary:hover:not(:disabled) { background: #155a4b; }
    .glass { border: 0; border-radius: 999px; background: var(--glass); color: var(--green); }

    /* ── dump ──────────────────────────────────────────── */
    .dump { padding: 22px 22px 40px; display: flex; flex-direction: column; gap: 22px; }
    .dump h1 { font: 400 30px/1.12 var(--serif); margin: 4px 0 0; }
    .dump-card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 6px; }
    .dump-card textarea { display: block; width: 100%; height: 230px; border: 0; outline: none; resize: vertical; padding: 14px; font: 400 14.5px/1.7 var(--sans); color: var(--ink); background: transparent; }
    .dump-card textarea::placeholder { color: var(--faint); }
    .tools { display: flex; gap: 8px; padding: 6px 8px 8px; flex-wrap: wrap; }
    .tint.on { background: var(--green); color: #fff; }
    .panel { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 12px; }
    .row { display: flex; align-items: center; gap: 6px; }
    .clock { margin-left: auto; font: 400 15px/1 var(--mono); color: var(--meta); }
    .track { height: 6px; background: var(--track); border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; width: 0; background: var(--green); border-radius: 999px; transition: width 1s linear; }
    .carry-row { display: flex; align-items: center; gap: 6px; background: var(--page); border-radius: 14px; padding: 8px 8px 8px 12px; }
    .carry-row span { flex: 1; font: 400 13.5px/1.5 var(--sans); }
    .carry-row.dropped span { text-decoration: line-through; color: var(--faint); }
    .ask { font: 400 13.5px/1.5 var(--sans); color: var(--meta); }
    .states { display: flex; gap: 8px; flex-wrap: wrap; }
    .feel { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
    .go { display: flex; flex-direction: column; gap: 14px; align-items: center; padding-top: 8px; }
    .go .primary { width: 100%; }
    .note { font: 400 11.5px/1.45 var(--mono); color: var(--faint); text-align: center; }
    .error { font: 400 13.5px/1.5 var(--sans); color: var(--body); background: var(--later); border-radius: 14px; padding: 10px 14px; }
    /* ── sorting (5a): the plan builds in front of you. Driven by the stream:
       your lines sit as chips while it thinks, then now, later and let go
       fill in as each item closes. */
    .sorting { padding: 22px 22px 40px; display: flex; flex-direction: column; gap: 18px; }
    .sorting h1 { font: 400 28px/1.12 var(--serif); margin: 6px 0 0; }
    .frags { display: flex; flex-wrap: wrap; gap: 6px; }
    .frag { font: 400 12.5px/1.35 var(--sans); padding: 6px 11px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--body);
            opacity: 0; transform: translateY(8px); transition: opacity .35s var(--rise), transform .35s var(--rise), background .35s var(--rise), border-color .35s var(--rise), color .35s var(--rise); }
    .frag.on { opacity: 1; transform: none; }
    .frag.hot { background: var(--green-tint); border-color: var(--green); color: var(--green); }
    .frags.dim .frag.on { opacity: .4; }
    .srows { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .srow { border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; opacity: .35; transition: opacity .4s var(--rise); }
    .srow.on { opacity: 1; }
    .srow.now { background: var(--task); } .srow.later { background: var(--later); } .srow.letgo { background: var(--letgo); }
    .srow .name { font: 400 17px/1.2 var(--serif); }
    .sitem { font: 400 12.5px/1.4 var(--sans); color: var(--body); background: var(--glass); border-radius: 11px; padding: 7px 11px; animation: land .35s var(--rise) both; }
    .srow.now .name + .sitem { font: 400 15px/1.3 var(--serif); color: var(--ink); }
    .smore { font: 400 11.5px/1.45 var(--mono); color: var(--meta); padding: 0 4px; }
    @keyframes land { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .hclock { font: 400 11.5px/1.45 var(--mono); color: var(--meta); white-space: nowrap; margin-left: auto; }
    @media (prefers-reduced-motion: reduce) {
      .frag, .srow { transition: none; } .frag { transform: none; } .sitem { animation: none; }
    }

    /* ── plan ──────────────────────────────────────────── */
    .plan { padding: 22px 22px 40px; display: flex; flex-direction: column; gap: 18px; }
    .plan-main { display: flex; flex-direction: column; gap: 18px; }
    .plan-side { display: flex; flex-direction: column; gap: 10px; }
    .plan-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .step { font: 400 11.5px/1.45 var(--mono); color: var(--meta); white-space: nowrap; }
    .task { background: var(--task); border-radius: 28px; padding: 26px 22px 22px; display: flex; flex-direction: column; gap: 14px; }
    .task h2 { font: 400 28px/1.15 var(--serif); margin: 0; }
    .task .detail { font: 400 14.5px/1.55 var(--sans); color: var(--body); margin: 0; max-width: 520px; }
    .task .why-btn { align-self: flex-start; font: 400 13px/1 var(--sans); padding: 8px 12px; }
    .task .why { font: 400 13.5px/1.5 var(--sans); color: var(--meta); margin: 0; max-width: 520px; }
    .timer { background: var(--card); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
    .timer .row { gap: 14px; }
    .timer .time { font: 400 22px/1 var(--mono); }
    .timer .tint { margin-left: auto; font: 500 13px/1 var(--sans); padding: 9px 16px; }
    .actions { display: flex; gap: 10px; align-items: center; }
    .actions .done { flex: 1; height: 50px; font-size: 15px; }
    .actions .skip { height: 50px; padding: 0 18px; font: 400 15px/1 var(--sans); }
    .restart { align-self: flex-start; font: 400 14px/1 var(--sans); background: var(--card); border: 0; border-radius: 999px; padding: 10px 16px; color: var(--green); }
    .then { font: 400 13.5px/1.5 var(--sans); color: var(--meta); padding: 0 6px; }
    .bucket { border-radius: 24px; padding: 16px 18px; }
    .bucket.later { background: var(--later); }
    .bucket.letgo { background: var(--letgo); }
    .bucket > button { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; color: var(--ink); text-align: left; }
    .bucket .name { font: 400 18px/1.2 var(--serif); }
    .bucket .count { font: 400 11.5px/1.45 var(--mono); color: var(--meta); }
    .bucket .count .sub { display: none; }
    .bucket .sign { margin-left: auto; flex: none; width: 28px; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, .75); display: flex; align-items: center; justify-content: center; font: 500 14px/1 var(--mono); color: var(--green); }
    .bucket .items { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; }
    .bucket .items .sub { font: 400 13.5px/1.5 var(--sans); color: var(--meta); }
    .chip { font: 400 13.5px/1.5 var(--sans); color: var(--body); background: var(--glass); border-radius: 12px; padding: 8px 12px; display: flex; gap: 10px; align-items: baseline; }
    .chip .tag { margin-left: auto; flex: none; font: 400 11px/1 var(--mono); color: var(--meta); }
    .change { align-self: flex-start; font: 400 14px/1 var(--sans); background: none; border: 0; padding: 4px 6px; color: var(--green); }
    .replan { display: flex; gap: 8px; flex-wrap: wrap; }
    .checks-btn { align-self: flex-start; font: 400 11.5px/1.45 var(--mono); background: none; border: 0; padding: 0 6px; color: var(--faint); text-align: left; }
    .checks { display: flex; flex-direction: column; gap: 4px; padding: 0 6px; }
    .checks span { font: 400 11.5px/1.45 var(--mono); color: var(--meta); }
    .save-row { display: flex; align-items: baseline; gap: 12px; padding: 4px 6px; flex-wrap: wrap; }
    .save { font: 400 14px/1 var(--sans); background: none; border: 0; padding: 0; color: var(--green); }
    .orient { font: 400 11.5px/1.45 var(--mono); color: var(--faint); }
    .orient button { font: inherit; background: none; border: 0; padding: 0; color: var(--faint); }
    .orient button[aria-pressed="true"] { color: var(--green); }

    /* ── desktop ───────────────────────────────────────── */
    @media (min-width: 860px) {
      .top { padding: 22px 40px; }
      .brand { font-size: 20px; }
      .streak .short { display: none; }
      .streak .long { display: inline; }
      .dump { max-width: 680px; margin: 0 auto; padding: 36px 40px 48px; gap: 26px; }
      .dump h1 { font-size: 40px; line-height: 1.08; margin: 0; }
      .dump-card { border-radius: 26px; padding: 8px; }
      .dump-card textarea { height: 260px; padding: 18px 20px; font-size: 15.5px; line-height: 1.75; }
      .tools { padding: 6px 10px 10px; }
      .tint { padding: 9px 14px; }
      .feel { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 10px; }
      .feel .ask { margin-right: 6px; }
      .go { flex-direction: row; gap: 22px; }
      .go .primary { width: auto; padding: 0 34px; }
      .note { text-align: left; }
      .plan { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; align-items: start; padding: 12px 40px 40px; max-width: 1240px; margin: 0 auto; }
      .plan-main { gap: 16px; }
      .plan-side { gap: 12px; padding-top: 50px; }
      .plan-head { justify-content: flex-start; }
      .plan-head .link { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; }
      .task { border-radius: 32px; padding: 36px 36px 30px; gap: 16px; }
      .task h2 { font-size: 38px; line-height: 1.1; }
      .task .detail { font: 400 17px/1.6 var(--sans); }
      .task-foot { display: flex; align-items: center; gap: 18px; margin-top: 8px; flex-wrap: wrap; }
      .actions .done { flex: none; height: 52px; padding: 0 30px; }
      .actions .skip { height: 52px; padding: 0 22px; }
      .timer { order: 2; margin: 0 0 0 auto; border-radius: 999px; padding: 8px 8px 8px 20px; flex-direction: row; align-items: center; gap: 14px; }
      .timer .row { display: contents; }
      .timer .time { font-size: 20px; order: 1; }
      .timer .track { width: 90px; order: 2; }
      .timer .tint { order: 3; margin: 0; padding: 10px 16px; }
      .then { padding: 0 8px; }
      .bucket .name { font-size: 20px; }
      .bucket .count .sub { display: inline; }
      .bucket .sign { width: 30px; height: 30px; }
      .bucket .items { padding-top: 14px; max-height: 330px; overflow: auto; }
      .bucket .items .sub { display: none; }
      .change { display: none; }
      .replan[data-desktop] { display: flex !important; padding: 0 4px; }
      .checks-btn, .checks, .save-row { padding: 0 8px; }
      .sorting { max-width: 680px; margin: 0 auto; padding: 36px 40px 48px; gap: 22px; }
      .sorting h1 { font-size: 40px; line-height: 1.08; margin: 0; }
      .frag { font-size: 13.5px; }
      .sitem { font-size: 13.5px; }
      .srow .name { font-size: 20px; }
    }
    @media (max-width: 859px) { .task-foot { display: contents; } }
  </style>
</head>
<body>

<header class="top">
  <span class="brand">clear your mind.</span>
  <span class="streak" id="streak" hidden><span class="short"></span><span class="long"></span></span>
  <span class="hclock" id="hclock" hidden></span>
</header>

<!-- ── DUMP ──────────────────────────────────────────── -->
<main class="dump" id="dump-view">
  <h1>what's on your mind?</h1>

  <div class="dump-card">
    <textarea id="dump-text" placeholder="all of it, in any order" aria-label="what's on your mind"></textarea>
    <div class="tools">
      <button class="tint" id="voice-btn" type="button">+ voice</button>
      <button class="tint" id="dtimer-btn" type="button" aria-expanded="false">+ timer</button>
      <button class="tint" id="carry-btn" type="button" aria-expanded="false" hidden></button>
    </div>

    <div class="panel rise" id="dtimer-panel" hidden>
      <div class="row">
        <span id="dtimer-mins" class="row"></span>
        <span class="clock" id="dtimer-time">10:00</span>
        <button class="link" id="dtimer-toggle" type="button" style="font-weight:500;font-size:13px;padding-left:6px">start</button>
      </div>
      <div class="track"><div class="fill" id="dtimer-fill"></div></div>
    </div>

    <div class="panel rise" id="carry-panel" hidden style="gap:6px;padding:4px 8px 10px"></div>
  </div>

  <div class="feel">
    <span class="ask">how much do you have?</span>
    <div class="states" id="states" role="group" aria-label="how much do you have"></div>
    <button class="pill sm" id="anx-btn" type="button" aria-pressed="false">+ feeling anxious</button>
  </div>

  <div class="error" id="error" hidden></div>

  <div class="go">
    <button class="primary" id="sort-btn" type="button">sort it →</button>
    <button class="link" id="one-btn" type="button">just one thing</button>
  </div>
  <p class="note" id="sample-note" hidden>the sorter is being rebuilt for three states, so for now "sort it" shows a sample plan made from a real 23 September dump</p>
</main>

<!-- ── PLAN ──────────────────────────────────────────── -->
<!-- ── SORTING ───────────────────────────────────────── -->
<main class="sorting" id="sort-view" hidden aria-live="polite">
  <h1 id="sort-stage">reading your dump</h1>
  <div class="frags" id="sort-frags"></div>
  <div class="srows" id="sort-rows">
    <div class="srow now" data-row="now"><span class="name">now</span></div>
    <div class="srow later" data-row="later"><span class="name">later</span></div>
    <div class="srow letgo" data-row="let_go"><span class="name">let go</span></div>
  </div>
</main>

<main class="plan" id="plan-view" hidden>
  <section class="plan-main">
    <div class="plan-head">
      <button class="link" id="back-btn" type="button">← my dump</button>
      <span class="step" id="step"></span>
    </div>

    <div class="task rise" id="task-body"></div>

    <span class="then" id="then" hidden></span>

    <button class="change" id="change-btn" type="button" aria-expanded="false">+ change something</button>
    <div class="replan" id="replan" data-desktop hidden>
      <button class="pill sm" type="button" data-replan="twenty">I have 20 minutes</button>
      <button class="pill sm" type="button" data-replan="tomorrow">move this to tomorrow</button>
      <button class="pill sm" type="button" data-replan="toptwo">done with the top two</button>
    </div>

    <button class="checks-btn" id="checks-btn" type="button" aria-expanded="false"></button>
    <div class="checks" id="checks" hidden></div>
    <div class="save-row">
      <button class="save" id="pdf-btn" type="button">save as PDF ↓</button>
      <span class="orient" id="pdf-orient" role="group" aria-label="page direction"><button type="button" data-orient="portrait">vertical</button> · <button type="button" data-orient="landscape">horizontal</button></span>
    </div>
  </section>

  <aside class="plan-side" id="buckets"></aside>
</main>

<script>
  // ── CONFIG ────────────────────────────────────────────
  const WORKER_URL = "https://brain-dump-proxy.samievargas.workers.dev";

  // "live" posts the dump to the Worker (prompt sort@v3). "sample" shows the
  // hand-sorted 23 September plans below instead, for a demo or while the
  // Worker is down; "just one thing" calls the Worker either way.
  const SORT_SOURCE = "live";

  // Names are display constants so they are easy to swap. The alternates the
  // design explored: wired · worried · wiped, full tank · half tank · fumes;
  // do · keep · release, today · someday · not mine.
  const ENERGY_LEVELS = ["plenty", "a little", "none"];
  const CAPS = { plenty: 3, "a little": 2, none: 1 };
  const TIMER_MIN = { plenty: 25, "a little": 15, none: 5 };
  const BUCKET_NAMES = { now: "now", later: "later", let_go: "let go" };
  const BUCKET_SUBS = { later: "safe here for later", let_go: "you can set these down" };
  const DUMP_TIMER_MINS = [5, 7, 10];

  // The same lists as BANNED_PHRASES in worker/contracts.js, each with the
  // words the page puts in its place.
  const BANNED = {
    all: [
      [/\byou must\b/gi, "you can"],
      [/\byou have to\b/gi, "you can"],
      [/\bjust do it\b/gi, "start small"],
      [/\bstop procrastinating\b/gi, "start when you're ready"],
      [/\blazy\b/gi, "tired"],
    ],
    anxious: [
      [/\byou (?:need to|should)\b/gi, "when you're ready, you can"],
      [/\b(?:need to|should)\b/gi, "could"],
    ],
  };

  const STRATEGIES = {
    "eat the frog": "the one you keep circling drains attention even while you do other things, so clearing it first frees up the rest of the list.",
    "5-min rule": "commit to five minutes and nothing more, because starting is the hard part and the rule gives you permission to stop.",
    "one gesture": "the decision is already made and the task is one physical action, so there is nothing to weigh before you start.",
    "pre-decided task": "the choice is made in the task text, so you follow it instead of comparing options on an empty stomach.",
    "pair it": "the message runs in the background while your hands do something else, which is two things moved for the effort of one.",
    "body doubling": "someone else being around, even on a video call, makes it easier to start and to keep going.",
    "temptation bundling": "the boring part gets paired with something you enjoy, and the enjoyable thing only happens during it.",
    "micro-commitment": "the goal is contact and not completion, so opening the file counts.",
    "physical reset": "moving your body first shifts your state, which makes whatever comes next easier to start.",
    "time boxing": "a hard stop before you begin makes starting feel safe, because it ends when the timer does.",
  };

  // ── SAMPLE ────────────────────────────────────────────
  // Samie's 23 September 2026 dump, re-sorted by hand into the three buckets
  // for each level. It is what the sorter's reply looks like before the page's
  // checks run, so it deliberately sends three for "now" at every level, says
  // "need to" once when anxious, and puts one idea in two buckets.

eeks and I feel bad cuz I know I like it when I do it I just can't make myself start like even ten minutes and I need to order groceries cuz I don't have anything for lunch and it's already like almost eleven and then there's the weekend where I don't have plans with anyone and I keep going back and forth on like if I should go to dinner with the guys. I need to go back to that podcast I like cuz it helps me calm down I keep just like cycling the same two episodes and oh I had this idea for like a little display that shows my whole day at a glance but I feel like it has to be perfect before I start so I just haven't started and I think I think that's everything I think the pharmacy is the one I keep coming back to so I should probably just call";

  // label, detail and strategy per level: plenty, a little, none.
  const SAMPLE_NOW = [

      detail: ["one call and one ask, and then it is off your mind for three months.", "ask for the 90-day switch, and that is the whole call.", "dial the number already saved in your phone, ask for the 90-day refill, and that is the whole call."],

      anxious: "one short message whenever it feels okay, and the recap can wait for his reply.",
      why: "the recap email is stuck until his notes come in", strategy: ["pair it", "5-min rule", "one gesture"] },
  ];
  const SAMPLE_LATER = [
    ["do", "check the lease renewal date against the lease itself"],
    ["do", "write the QBR recap email once Matt's notes are in"],
    ["do", "10 minutes of strength training with the podcast on"],
    ["do", "hang the Lego sets on the wall"],
    ["decide", "storage seats or regular ones, then schedule the pickup"],
    ["decide", "the costume for the birthday"],
    ["decide", "dinner with the guys this weekend"],
    ["idea", "the day-at-a-glance display"],

    ["idea", "the games list for the new Steam machine"],
  ];
  const SAMPLE_LET_GO = [
    "going or not going to pottery tonight is not a verdict on who you are.",
    "two weeks without strength training doesn't erase the progress you made.",
    "the boxes in the living room are just boxes waiting for your energy.",
    "the day-at-a-glance display is allowed to start messy.",

  function samplePlan(level, anxious, carried) {
    const L = ENERGY_LEVELS.indexOf(level);
    const later = SAMPLE_LATER.map(([tag, text]) => ({ text, tag }));
    // a kept carry-over that is already one of these tasks is not added twice
    const known = new Set(SAMPLE_NOW.flatMap(t => t.label.map(norm)));
    carried.filter(text => !known.has(norm(text))).forEach(text => later.unshift({ text, tag: "carried" }));
    return {
      now: SAMPLE_NOW.map(t => ({ label: t.label[L], detail: anxious ? t.anxious : t.detail[L], why: t.why, strategy: t.strategy[L] })),
      later,
      let_go: [...SAMPLE_LET_GO],
    };
  }

  // ── CHECKS ────────────────────────────────────────────
  // The rules evals/graders.js checks offline, run on the plan before it is
  // shown. Each fix is written down in plain words for the checks line.
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();

  // The global bans everywhere, "should" and "need to" only when anxious.
  // Records each phrase it replaces in `found`.
  function rewriteBanned(s, anxious, found = []) {
    let out = s;
    for (const [re, to] of [...BANNED.all, ...(anxious ? BANNED.anxious : [])]) out = out.replace(re, m => { found.push(m.toLowerCase()); return to; });
    return out;
  }

  function checkPlan(raw, level, anxious) {
    const fixes = [], notes = [];
    const cap = CAPS[level];
    const plan = {
      now: (raw.now || []).map(t => ({ ...t })),
      later: (raw.later || []).map(t => typeof t === "string" ? { text: t, tag: "do" } : { ...t }),
      let_go: [...(raw.let_go || [])],
    };

    // 1. cap: clip now, the extras go to later tagged "over cap".
    if (plan.now.length > cap) {
      const extra = plan.now.splice(cap);
      plan.later.unshift(...extra.map(t => ({ text: t.label.replace(/\.$/, ""), tag: "over cap" })));
      fixes.push(`the sorter sent ${cap + extra.length} for ${BUCKET_NAMES.now}, held to ${cap} on the page, ${extra.length} moved to ${BUCKET_NAMES.later}`);
    } else notes.push(`${plan.now.length} of ${cap} within the cap`);

    // 2. banned phrases: the global list everywhere, "should" and "need to" when anxious.
    const rules = [...BANNED.all, ...(anxious ? BANNED.anxious : [])];
    const found = [];
    const clean = s => rewriteBanned(s, anxious, found);
    plan.now.forEach(t => { t.label = clean(t.label); t.detail = clean(t.detail || ""); });
    plan.later.forEach(t => { t.text = clean(t.text); });
    plan.let_go = plan.let_go.map(clean);
    if (found.length) {
      const uniq = [...new Set(found)];
      fixes.push(`the sorter wrote ${uniq.map(p => `"${p}"`).join(" and ")}${found.length > 1 ? ` ${found.length} times` : " once"}, rewritten on the page`);
    } else notes.push("no banned phrases");

    // 3. duplicates: anything in let go stays only in let go.
    const letGo = plan.let_go.map(norm);
    const inLetGo = s => { const n = norm(s); return n && letGo.some(l => l === n || l.startsWith(n + " ") || n.startsWith(l + " ")); };
    const dupes = [];
    plan.now = plan.now.filter(t => inLetGo(t.label) ? (dupes.push(t.label), false) : true);
    plan.later = plan.later.filter(t => inLetGo(t.text) ? (dupes.push(t.text), false) : true);
    // a carried item the sorter already placed is not listed twice
    const seen = new Set(plan.now.map(t => norm(t.label)));
    plan.later = plan.later.filter(t => { const n = norm(t.text); if (seen.has(n)) return false; seen.add(n); return true; });
    dupes.forEach(d => fixes.push(`"${d}" came back in two buckets, kept in ${BUCKET_NAMES.let_go}`));

    // 4. every item placed.
    const placed = plan.now.length + plan.later.length + plan.let_go.length;
    notes.push(`every item placed · ${placed} of ${placed}`);

    return { plan, fixes, notes };
  }

  // ── STATE ─────────────────────────────────────────────
  let level = "a little";
  let anxious = false;
  let result = null;          // { plan, fixes, notes, source }
  let done = [], moved = [];  // indexes into result.plan.now
  let open = { later: false, let_go: false };
  let showWhy = false;
  let justOpened = null;      // the section to animate on this render only
  let carryChoice = {};       // text -> "keep" | "drop"
  let dumpCount = parseInt(localStorage.getItem("bd-count") || "0", 10) || 0;

  const $ = id => document.getElementById(id);
  const ta = $("dump-text");
  const desktop = window.matchMedia("(min-width: 860px)");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = sec => Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");

  function store(kind, key, value) {
    try { window[kind].setItem(key, JSON.stringify(value)); } catch (e) {}
  }
  function load(kind, key, fallback) {
    try { const v = window[kind].getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  }

  // ── TIMER ─────────────────────────────────────────────
  // One timer: the optional dump timer on the first screen, the task timer on
  // the plan, sized by the level unless "I have 20 minutes" set it.
  const timer = { total: 600, left: 600, running: false, iv: null, onTick: () => {} };
  function setTimer(min) {
    clearInterval(timer.iv);
    timer.total = timer.left = min * 60; timer.running = false;
    timer.onTick();
  }
  function toggleTimerRun() {
    if (timer.running) { timer.running = false; clearInterval(timer.iv); timer.onTick(); return; }
    if (!timer.left) timer.left = timer.total;
    timer.running = true;
    timer.iv = setInterval(() => {
      timer.left = Math.max(0, timer.left - 1);
      if (!timer.left) { timer.running = false; clearInterval(timer.iv); }
      timer.onTick();
    }, 1000);
    timer.onTick();
  }
  function paintTimer(timeEl, fillEl, btnEl, idle) {
    timeEl.textContent = fmt(timer.left);
    fillEl.style.width = (100 * (1 - timer.left / timer.total)) + "%";
    btnEl.textContent = timer.running ? "pause" : (!timer.left ? "reset" : (timer.left < timer.total ? "resume" : idle));
  }

  // ── DUMP SCREEN ───────────────────────────────────────

  // Carry-over: unfinished "now" items and anything moved with "not today",
  // offered on the next dump behind keep and drop.
  function carryItems() { return load("localStorage", "bd-carry", []).filter(t => typeof t === "string" && t.trim()); }
  function renderCarry() {
    const items = carryItems();
    const btn = $("carry-btn"), panel = $("carry-panel");

  $("carry-btn").addEventListener("click", () => { $("carry-panel").hidden = !$("carry-panel").hidden; renderCarry(); });
  $("carry-panel").addEventListener("click", e => {

    const t = carryItems()[+b.dataset.carry], c = b.dataset.choice;

    renderCarry();

  function renderStreak() {
    const el = $("streak");
    el.hidden = !dumpCount;
    el.querySelector(".short").textContent = `${dumpCount} this week`;
    el.querySelector(".long").textContent = `${dumpCount} dump${dumpCount === 1 ? "" : "s"} this week · stays in this tab`;
  }

  function showError(msg) { $("error").textContent = msg; $("error").hidden = false; }
  function clearError() { $("error").hidden = true; }

  // ── SESSION AND THE WORKER ────────────────────────────
  // The page sends a mode, the level, the anxious switch, the dump and the
  // kept carry-overs, and nothing else.
  let sessionToken = null;
  async function session() {
    if (sessionToken) return sessionToken;
    try {
      const r = await fetch(WORKER_URL + "/session");
      if (r.ok) sessionToken = (await r.json()).token;
    } catch (e) { /* the worker may run without sessions; the POST will say */ }
    return sessionToken;
  }

  async function callWorker(body, { onDelta, onThinking } = {}) {
    const token = await session();
    const headers = { "Content-Type": "application/json" };
    if (token) headers["x-bd-session"] = token;
    const res = await fetch(WORKER_URL + "/sort", { method: "POST", headers, body: JSON.stringify(body) });
    if (res.status === 401 && token) { sessionToken = null; return callWorker(body, { onDelta, onThinking }); }
    if (!res.ok) {
      let msg = "something went wrong, so check your connection and try again";
      try { msg = (await res.json()).message || msg; } catch (e) {}
      throw new Error(msg);
    }
    if (!body.stream) return res.json();

    // Server-sent events straight from the API, then one bd_meta event from
    // the worker with the usage and the parse path.
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", text = "", meta = null, stopReason = null, apiError = null;
    for (;;) {
      const { value, done: end } = await reader.read();
      if (end) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (chunk.match(/^event: (\S+)/m) || [])[1];
        const line = chunk.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        let data;
        try { data = JSON.parse(line.slice(6)); } catch (e) { continue; }
        if (data.type === "content_block_delta" && data.delta && data.delta.type === "text_delta") { text += data.delta.text; if (onDelta) onDelta(text); }
        // Thinking is never shown, only used as a heartbeat for the stage line.
        if (onThinking && ((data.type === "content_block_start" && data.content_block && data.content_block.type === "thinking") || (data.type === "content_block_delta" && data.delta && data.delta.type === "thinking_delta"))) onThinking();
        if (data.type === "message_delta" && data.delta && data.delta.stop_reason) stopReason = data.delta.stop_reason;
        if (data.type === "error" || ev === "error") apiError = data.error || data;
        if (ev === "bd_meta") meta = data;
      }
    }
    return { text, meta, stopReason: (meta && meta.stop_reason) || stopReason, apiError };
  }

  // A stream can end without a usable plan three ways; each gets a sentence
  // a person can act on instead of a parser message.
  function planFrom(text, stopReason, apiError) {
    if (apiError) throw new Error("the sorter had a bad moment, so try again in a little while.");
    const clean = (text || "").replace(/```json|```/g, "").trim();
    if (stopReason === "max_tokens") throw new Error("the sorter ran out of room before it finished, so try again in a moment.");
    if (!clean) throw new Error("the sorter came back empty, so try again in a moment.");
    try { return JSON.parse(clean); }
    catch (e) { throw new Error("the sorter's answer came back garbled, so try again in a moment."); }
  }

  // ── SORT ──────────────────────────────────────────────
  // The plan so far, from a reply that is still streaming: everything up to
  // the last value that closed, with the open brackets closed after it. Items
  // that are half-written are left out, so each one lands whole.
  function partialPlan(text) {
    const stack = [];
    let inStr = false, esc = false, cut = -1, cutStack = [];
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inStr) {
        if (esc) esc = false;
        else if (c === "\\") esc = true;
        else if (c === '"') { inStr = false; if (stack[stack.length - 1] === "[") { cut = i + 1; cutStack = stack.slice(); } }
        continue;
      }
      if (c === '"') inStr = true;
      else if (c === "{" || c === "[") { stack.push(c); cut = i + 1; cutStack = stack.slice(); }
      else if (c === "}" || c === "]") { stack.pop(); cut = i + 1; cutStack = stack.slice(); }
    }
    if (cut < 0) return null;
    let json = text.slice(0, cut);
    for (let k = cutStack.length - 1; k >= 0; k--) json += cutStack[k] === "{" ? "}" : "]";
    try { return JSON.parse(json.replace(/^```(?:json)?\s*/, "")); } catch (e) { return null; }
  }

  // Up to five short lines from the person's own dump, for the chips: split
  // on sentences and connectors, filler and "I need to" stripped, three to
  // nine words each, so a rambling voice dump still reads as its things.
  function dumpLines(dump) {
    const FILLER = /^(?:so|um+|uh+|like|okay|ok|and|but|also|just|really|oh|then|dang|honestly|i guess|i think|i mean|i\s+(?:also\s+)?(?:need|want|have|got)\s+to|need\s+to|want\s+to)\b[\s,]*/i;
    const TAIL = /\s+(?:a|an|the|to|my|i|and|of|it|that|for|in|on|is|cuz|so|like|with|but|or|if|them|me)$/i;
    const seen = new Set(), out = [];
    for (let t of dump.split(/[\n.!?;:,]+|\s+(?:and|but|so|cuz|because|then|oh|also|um+|okay|ok)\s+|\s+(?=i\s+(?:also\s+)?(?:need|want|have)\s+to\b)/i)) {
      t = t.trim();
      for (let k = 0; k < 6; k++) { const n = t.replace(FILLER, ""); if (n === t) break; t = n.trim(); }
      if (/^(?:i|i'm|it's|it|that|there|this|much|so much|a lot)\b|^(?:they|he|she|you)\s+said\b|don'?t know|where was i|that's everything/i.test(t)) continue;
      let w = t.split(/\s+/).filter(Boolean);
      if (w.length < 3) continue;
      if (w.length > 9) w = w.slice(0, 9);
      let line = w.join(" ");
      while (TAIL.test(line)) line = line.replace(TAIL, "");
      if (line.split(/\s+/).length < 3) continue;
      const key = line.toLowerCase().split(/\s+/).slice(0, 3).join(" ");
      if (seen.has(key)) continue;
      seen.add(key); out.push(line);
      if (out.length === 5) break;
    }
    return out;
  }

  // The sorting screen (5a). Stages follow the stream: "reading your dump"
  // when the request goes out, "thinking it through" on the first thinking
  // event, "picking one thing" on the first text, "sorting the rest" once now
  // has closed, and "sorted." at the end. The header keeps the level and the
  // elapsed seconds.
  const ROW_SHOW = 4;
  function startSorting(dump, lvl, anxious, { withRows = true, opening = "reading your dump" } = {}) {
    const stage = $("sort-stage"), frags = $("sort-frags"), rows = $("sort-rows");
    const t0 = Date.now();
    let phase = "reading", hot = 0;
    stage.textContent = opening;
    frags.className = "frags";
    frags.innerHTML = dumpLines(dump).map(t => `<span class="frag">${esc(t)}</span>`).join("");
    const chips = [...frags.children];
    chips.forEach((c, i) => setTimeout(() => c.classList.add("on"), 130 * i));
    rows.hidden = !withRows;
    rows.querySelectorAll(".srow").forEach(r => { r.classList.remove("on"); r.querySelectorAll(".sitem, .smore").forEach(n => n.remove()); });
    const shown = { now: 0, later: 0, let_go: 0 };
    const clock = $("hclock");
    const tick = () => { const sec = Math.floor((Date.now() - t0) / 1000); clock.textContent = `${lvl} · ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; };
    tick(); clock.hidden = false; $("streak").hidden = true;
    const iv = setInterval(tick, 1000);
    let hotIv = null;
    const think = () => {
      if (phase !== "reading") return;
      phase = "thinking"; stage.textContent = withRows ? "thinking it through" : opening;
      const step = () => { chips.forEach((c, i) => c.classList.toggle("hot", i === hot % chips.length)); hot++; };
      if (chips.length) { step(); hotIv = setInterval(step, 700); }
    };
    // no thinking event arrives when the model skips thinking; move on anyway
    const fallback = setTimeout(think, 1500);
    const land = (key, texts) => {
      const row = rows.querySelector(`[data-row="${key}"]`);
      row.classList.add("on");
      for (; shown[key] < Math.min(texts.length, ROW_SHOW); shown[key]++) {
        const el = document.createElement("span");
        el.className = "sitem"; el.textContent = texts[shown[key]];
        row.appendChild(el);
      }
      if (texts.length > ROW_SHOW) {
        let more = row.querySelector(".smore");
        if (!more) { more = document.createElement("span"); more.className = "smore"; row.appendChild(more); }
        more.textContent = `+ ${texts.length - ROW_SHOW} more`;
      }
    };
    const typing = () => rows.querySelector('[data-row="now"] .sitem.typing');
    return {
      onThinking: think,
      onDelta(text) {
        if (phase === "reading" || phase === "thinking") {
          phase = "writing"; stage.textContent = withRows ? "picking one thing" : opening;
          clearInterval(hotIv); chips.forEach(c => c.classList.remove("hot")); frags.classList.add("dim");
        }
        if (!withRows) return;
        const plan = partialPlan(text) || {};
        const now = (plan.now || []).filter(t => t && t.label).map(t => rewriteBanned(t.label, anxious).replace(/\.$/, ""));
        // the first now label types in as it streams
        if (!now.length) {
          const m = text.match(/"now"\s*:\s*\[\s*\{[^]*?"label"\s*:\s*"((?:[^"\\]|\\.)*)/);
          if (m) {
            let el = typing();
            if (!el) { el = document.createElement("span"); el.className = "sitem typing"; rows.querySelector('[data-row="now"]').classList.add("on"); rows.querySelector('[data-row="now"]').appendChild(el); }
            try { el.textContent = JSON.parse('"' + m[1].replace(/\\$/, "") + '"'); } catch (e) { /* mid-escape */ }
          }
          return;
        }
        const t = typing(); if (t) { t.remove(); }
        land("now", now);
        if ("later" in plan) { if (phase === "writing") { phase = "rest"; stage.textContent = "sorting the rest"; } land("later", (plan.later || []).filter(x => x && x.text).map(x => rewriteBanned(x.text, anxious))); }
        if ("let_go" in plan) land("let_go", (plan.let_go || []).filter(Boolean).map(x => rewriteBanned(x, anxious)));
      },
      done() { stage.textContent = "sorted."; },
      stop() {
        clearInterval(iv); clearInterval(hotIv); clearTimeout(fallback);
        clock.hidden = true; renderStreak();
      },
    };
  }

  async function runSort() {
    const dump = ta.value.trim();
    if (!dump) { showError("type something first, anything that's on your mind"); return; }
    clearError();
    const carried = carryItems().filter(t => carryChoice[t] === "keep");

    if (SORT_SOURCE === "sample") {
      result = { raw: samplePlan(level, anxious, carried), source: "sample" };
    } else {
      showView("sort");
      const sorting = startSorting(dump, level, anxious);
      try {
        const body = { mode: "sort", energy_state: level, anxious, dump, stream: true };
        if (carried.length) body.carried = carried;
        const { text, stopReason, apiError } = await callWorker(body, { onDelta: sorting.onDelta, onThinking: sorting.onThinking });
        result = { raw: planFrom(text, stopReason, apiError), source: "live" };
        sorting.onDelta(text);
        sorting.done();
        await new Promise(r => setTimeout(r, 600));
      } catch (err) {
        sorting.stop();
        showView("dump");
        showError(err.message || "something went wrong, so check your connection and try again");
        return;
      }
      sorting.stop();
    }
    result.level = level; result.anxious = anxious;
    dumpCount++; try { localStorage.setItem("bd-count", dumpCount); } catch (e) {}
    carryChoice = {};
    startPlan();
  }

  async function runOneThing() {
    const dump = ta.value.trim();
    if (!dump) { showError("type something first, even one word is fine"); return; }
    clearError();
    showView("sort");
    const sorting = startSorting(dump, "just one thing", anxious, { withRows: false, opening: "finding one thing" });
    let one;
    try {
      const { plan } = await callWorker({ mode: "emergency", dump });
      one = { label: plan.one_thing, detail: plan.why, why: "", strategy: "" };
    } catch (e) {
      // Same rule as EMERGENCY_FALLBACK in worker/contracts.js, never from a model.
      one = { label: "open the smallest thing on your list.", detail: "just open it, and that counts.", why: "", strategy: "" };
    } finally { sorting.stop(); }
    result = { raw: { now: [one], later: [], let_go: [] }, source: "one", level: "none", anxious };
    startPlan();
  }

  function startPlan() {
    done = []; moved = []; showWhy = false;
    open = { later: desktop.matches, let_go: false };
    Object.assign(result, checkPlan(result.raw, result.level, result.anxious));
    renderPlan();
    setTimer(TIMER_MIN[result.level]);
    showView("plan");
  }

  // ── PLAN SCREEN ───────────────────────────────────────
  function queue() {
    return result.plan.now.map((t, i) => ({ ...t, i })).filter(t => !moved.includes(t.i));
  }

  function renderPlan() {
    const q = queue();
    const left = q.filter(t => !done.includes(t.i));
    const cur = left[0], next = left[1];
    const isOne = result.source === "one";

    $("step").textContent = isOne ? "just one thing"
      : result.level + (result.anxious ? " · anxious" : "") + (cur ? ` · ${q.length - left.length + 1} of ${q.length}` : "");

    const body = $("task-body");
    if (cur) {
      const strat = STRATEGIES[cur.strategy];
      const whyText = [cur.why, cur.strategy && `the idea behind it is ${cur.strategy}${strat ? ": " + strat : ""}`].filter(Boolean).join(", and ");
      body.innerHTML = `
        <h2>${esc(cur.label)}</h2>
        ${cur.detail ? `<p class="detail">${esc(cur.detail)}</p>` : ""}
        ${whyText ? `<button class="glass why-btn" type="button" id="why-btn" aria-expanded="${showWhy}">${showWhy ? "−" : "+"} why this one</button>
          <p class="why${justOpened === "why" ? " rise" : ""}" ${showWhy ? "" : "hidden"}>${esc(whyText)}</p>` : ""}
        <div class="task-foot">
          <div class="timer">
            <div class="row"><span class="time" id="ttime"></span><button class="tint" type="button" id="ttoggle">start</button></div>
            <div class="track"><div class="fill" id="tfill"></div></div>
          </div>
          <div class="actions">
            <button class="primary done" type="button" id="done-btn">done →</button>
            ${isOne ? "" : `<button class="glass skip" type="button" id="skip-btn">not today</button>`}
          </div>
        </div>`;
      $("ttoggle").onclick = () => { if (!timer.left) setTimer(timer.total / 60); else toggleTimerRun(); };
      $("done-btn").onclick = () => { done.push(cur.i); afterStep(); };
      if ($("skip-btn")) $("skip-btn").onclick = () => moveToLater(cur.i);
      if ($("why-btn")) $("why-btn").onclick = () => { showWhy = !showWhy; justOpened = "why"; renderPlan(); };
    } else {
      body.innerHTML = `<h2>that's it for now.</h2>
        <button class="restart" type="button" id="restart-btn">start again</button>`;
      $("restart-btn").onclick = () => { done = []; moved = []; afterStep(); };
    }
    timer.onTick = () => { if ($("ttime")) paintTimer($("ttime"), $("tfill"), $("ttoggle"), "start"); };
    timer.onTick();

    $("then").hidden = !next;
    if (next) $("then").textContent = `then · ${next.label.replace(/\.$/, "")}`;

    const later = laterItems();
    const cards = isOne ? [] : [
      { key: "later", cls: "later", items: later },
      { key: "let_go", cls: "letgo", items: result.plan.let_go.map(text => ({ text })) },
    ];
    $("buckets").innerHTML = cards.map(c => `
      <div class="bucket ${c.cls}">
        <button type="button" data-bucket="${c.key}" aria-expanded="${open[c.key]}">
          <span class="name">${BUCKET_NAMES[c.key]}</span>
          <span class="count">${c.items.length}<span class="sub"> · ${BUCKET_SUBS[c.key]}</span></span>
          <span class="sign">${open[c.key] ? "−" : "+"}</span>
        </button>
        ${open[c.key] ? `<div class="items${justOpened === c.key ? " rise" : ""}"><span class="sub">${BUCKET_SUBS[c.key]}</span>
          ${c.items.map(it => `<span class="chip"><span>${esc(it.text)}</span>${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ""}</span>`).join("")}
        </div>` : ""}
      </div>`).join("");

    const noReplan = isOne || !cur;
    $("change-btn").hidden = noReplan;
    if (noReplan) { $("replan").hidden = true; $("change-btn").textContent = "+ change something"; $("change-btn").setAttribute("aria-expanded", false); }
    $("replan").toggleAttribute("data-desktop", !noReplan);

    // the checks line
    const fixes = result.fixes || [];
    const openChecks = !$("checks").hidden;
    $("checks-btn").hidden = isOne;
    $("checks-btn").textContent = `✓ checked${fixes.length ? `, ${fixes.length} small fix${fixes.length > 1 ? "es" : ""}` : ""}`
      + (result.source === "sample" ? " · sample plan" : "");
    $("checks-btn").setAttribute("aria-expanded", openChecks);
    $("checks").innerHTML = [...fixes, ...(result.notes || [])].map(t => `<span>${esc(t)}</span>`).join("")
      + (result.source === "sample" ? `<span>a hand-sorted sample from a 23 September dump, while the sorter is rebuilt</span>` : "");

    justOpened = null;
    saveState();
  }

  // later: moved items first, then whatever the checks left there
  function laterItems() {
    return [
      ...moved.map(i => ({ text: result.plan.now[i].label.replace(/\.$/, ""), tag: "moved" })),
      ...result.plan.later,
    ];
  }

  // ── SAVE AS PDF (6b) ──────────────────────────────────
  // A white letter page with no filled areas, so it prints light: the three
  // buckets as thin teal, amber and rose outlines, tick boxes to check off on
  // paper, portrait (stacked) or landscape (three columns). Opens in a new
  // tab with the print dialog up, where "save as PDF" is the destination.
  let pdfOrient = (() => { try { return localStorage.getItem("bd-pdf-orient") === "landscape" ? "landscape" : "portrait"; } catch (e) { return "portrait"; } })();
  function renderOrient() {
    $("pdf-orient").querySelectorAll("[data-orient]").forEach(b => b.setAttribute("aria-pressed", b.dataset.orient === pdfOrient));
  }
  $("pdf-orient").addEventListener("click", e => {
    const b = e.target.closest("[data-orient]"); if (!b) return;
    pdfOrient = b.dataset.orient; renderOrient();
    try { localStorage.setItem("bd-pdf-orient", pdfOrient); } catch (err) {}
  });
  renderOrient();

  function exportPDF() {
    if (!result || !result.plan) return;
    const wide = pdfOrient === "landscape";
    const date = new Date().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
    const isOne = result.source === "one";
    const state = isOne ? "just one thing" : result.level + (result.anxious ? " · anxious" : "");
    const nowRows = queue().map(t => {
      const isDone = done.includes(t.i);
      return `<div class="task${isDone ? " done" : ""}"><span class="box">${isDone ? "✓" : ""}</span>
        <div class="tx"><span class="label">${esc(t.label)}</span>${t.detail ? `<span class="detail">${esc(t.detail)}</span>` : ""}</div></div>`;
    }).join("");
    const later = laterItems();
    const LATER_CAP = 7;
    const shownLater = wide ? later.slice(0, LATER_CAP) : later;
    const laterRows = shownLater.map(it => `<div class="li"><span class="lbox"></span><span>${esc(it.text)}</span></div>`).join("")
      + (wide && later.length > LATER_CAP ? `<span class="more">+ ${later.length - LATER_CAP} more</span>` : "");
    const letRows = result.plan.let_go.map(t => `<span class="lg">${esc(t)}</span>`).join("");
    const empty = `<span class="more">nothing here</span>`;
    const html = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
      <title>brain dump · ${esc(date)}</title>
      <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Onest:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet"/>
      <style>
        @page { size: letter ${wide ? "landscape" : "portrait"}; margin: 0; }
        * { box-sizing: border-box; margin: 0; }
        :root { --teal: oklch(.55 .1 200); --amber: oklch(.55 .1 60); --rose: oklch(.55 .1 330); }
        html, body { background: #fff; }
        body { font-family: 'Onest', Helvetica, Arial, sans-serif; color: #161513; width: ${wide ? "11in" : "8.5in"}; min-height: ${wide ? "8.5in" : "11in"}; margin: 0 auto;
               padding: ${wide ? "40px 40px 25px" : "50px 50px 31px"}; display: flex; flex-direction: column; gap: 19px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .head { display: flex; align-items: baseline; }
        .brand { font: 400 28px/1 'Young Serif', Georgia, serif; color: #1a6b5a; }
        .date { margin-left: auto; font: 400 15px/1.4 'Geist Mono', monospace; color: #77746b; }
        .bucket { border: 2.3px solid; border-radius: 28px; padding: ${wide ? "22px" : "22px 25px"}; display: flex; flex-direction: column; gap: 12px; break-inside: avoid; }
        .bucket.now { border-color: var(--teal); } .bucket.later { border-color: var(--amber); } .bucket.letgo { border-color: var(--rose); gap: 8px; }
        .bh { display: flex; ${wide ? "flex-direction: column; gap: 3px;" : "align-items: baseline; gap: 12px;"} }
        .bn { font: 400 25px/1.2 'Young Serif', Georgia, serif; }
        .now .bn { color: var(--teal); } .later .bn { color: var(--amber); } .letgo .bn { color: var(--rose); }
        .bs, .more { font: 400 14px/1.4 'Geist Mono', monospace; color: #77746b; }
        .task { display: flex; gap: 15px; align-items: flex-start; ${wide ? "padding-bottom: 12px; border-bottom: 1.5px solid #e4e2dc;" : ""} }
        .box { flex: none; width: ${wide ? "20px" : "22px"}; height: ${wide ? "20px" : "22px"}; border: 2.3px solid var(--teal); border-radius: 6px; margin-top: 3px; color: var(--teal); font: 500 14px/17px 'Geist Mono', monospace; text-align: center; }
        .tx { display: flex; flex-direction: column; gap: 3px; }
        .label { font: 400 ${wide ? "20px" : "22px"}/1.25 'Young Serif', Georgia, serif; }
        .detail { font: 400 ${wide ? "15px" : "16.5px"}/1.45 'Onest', sans-serif; color: ${wide ? "#55534c" : "#3a3833"}; }
        .task.done .label, .task.done .detail { text-decoration: line-through; color: #99968c; }
        .lgrid { display: ${wide ? "flex; flex-direction: column" : "grid; grid-template-columns: 1fr 1fr; column-gap: 25px"}; row-gap: 8px; gap: 8px 25px; }
        .li { display: flex; gap: 11px; align-items: flex-start; font: 400 ${wide ? "15px" : "15.5px"}/1.35 'Onest', sans-serif; color: #3a3833; }
        .lbox { flex: none; width: 16px; height: 16px; border: 1.5px solid var(--amber); border-radius: 5px; margin-top: 3px; }
        .lg { font: 400 ${wide ? "15px" : "15.5px"}/1.45 'Onest', sans-serif; color: #55534c; }
        .cols { flex: 1; display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; min-height: 0; }
        .cols .later { overflow: hidden; }
        .foot { font: 400 13px/1.4 'Geist Mono', monospace; color: #99968c; text-align: center; margin-top: auto; }
      </style></head><body>
      <div class="head"><span class="brand">clear your mind.</span><span class="date">${esc(date)} · ${esc(state)}</span></div>
      ${wide ? '<div class="cols">' : ""}
      <div class="bucket now"><div class="bh"><span class="bn">${BUCKET_NAMES.now}</span><span class="bs">${wide ? "one at a time" : "one at a time, in this order"}</span></div>${nowRows || empty}</div>
      ${isOne ? "" : `<div class="bucket later"><div class="bh"><span class="bn">${BUCKET_NAMES.later}</span><span class="bs">${BUCKET_SUBS.later}</span></div><div class="lgrid">${laterRows || empty}</div></div>
      <div class="bucket letgo"><div class="bh"><span class="bn">${BUCKET_NAMES.let_go}</span><span class="bs">${BUCKET_SUBS.let_go}</span></div>${letRows || empty}</div>`}
      ${wide ? "</div>" : ""}
      <span class="foot">made with brain dump · samievargas.github.io/brain-dump</span>
      <script>window.onload = () => (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => window.print());<\/script>
      </body></html>`;
    const win = window.open("", "_blank");
    if (!win) { $("pdf-btn").textContent = "allow pop-ups to save the PDF"; return; }
    win.document.write(html);
    win.document.close();
    $("pdf-btn").textContent = "save as PDF ↓";
  }
  $("pdf-btn").addEventListener("click", exportPDF);

  function afterStep() {
    showWhy = false;
    setTimer(TIMER_MIN[result.level]);
    renderPlan();
  }

  function moveToLater(i) {
    moved.push(i);
    afterStep();
  }

  $("buckets").addEventListener("click", e => {
    const b = e.target.closest("[data-bucket]"); if (!b) return;
    open[b.dataset.bucket] = !open[b.dataset.bucket];
    justOpened = b.dataset.bucket;
    renderPlan();
  });
  $("change-btn").addEventListener("click", () => {
    const show = $("replan").hidden;
    $("replan").hidden = !show;
    $("change-btn").textContent = (show ? "− " : "+ ") + "change something";
    $("change-btn").setAttribute("aria-expanded", show);
  });
  $("replan").addEventListener("click", e => {
    const b = e.target.closest("[data-replan]"); if (!b) return;
    const left = queue().filter(t => !done.includes(t.i));
    if (b.dataset.replan === "twenty") setTimer(20);
    if (b.dataset.replan === "tomorrow" && left[0]) moveToLater(left[0].i);
    if (b.dataset.replan === "toptwo") { queue().slice(0, 2).forEach(t => { if (!done.includes(t.i)) done.push(t.i); }); afterStep(); }
  });
  $("checks-btn").addEventListener("click", () => {
    $("checks").hidden = !$("checks").hidden;
    $("checks-btn").setAttribute("aria-expanded", !$("checks").hidden);
  });

  // ── VIEWS AND PERSISTENCE ─────────────────────────────
  function showView(v) {
    $("dump-view").hidden = v !== "dump";
    $("sort-view").hidden = v !== "sort";
    $("plan-view").hidden = v !== "plan";
    if (v === "dump") {
      setTimer(dumpMin);
      timer.onTick = renderDumpTimer;
      renderDumpTimer(); renderStates(); renderCarry(); renderStreak();
    } else if (v === "plan") {
      renderStreak();
    }
    window.scrollTo(0, 0);
    if (v !== "sort") store("sessionStorage", "bd-view", v);
  }
  $("back-btn").addEventListener("click", () => showView("dump"));

  // Unfinished "now" items and everything moved with "not today" become the
  // next dump's carry-over. The plan itself stays in this tab.
  function saveState() {
    if (!result || !result.plan || result.source === "one") return;
    const unfinished = result.plan.now.map((t, i) => ({ t, i }))
      .filter(({ i }) => !done.includes(i)).map(({ t }) => t.label.replace(/\.$/, ""));
    store("localStorage", "bd-carry", unfinished);
    store("sessionStorage", "bd-plan", { result: { raw: result.raw, source: result.source, level: result.level, anxious: result.anxious }, done, moved });
  }

  $("sort-btn").addEventListener("click", runSort);
  $("one-btn").addEventListener("click", runOneThing);
  $("voice-btn").addEventListener("click", toggleVoice);

  // ── VOICE ─────────────────────────────────────────────
  let recognition = null;
  function toggleVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showError("voice input isn't supported in this browser, so try Chrome"); return; }
    if (recognition) { stopVoice(); return; }
    recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = "en-US";
    let base = ta.value && !ta.value.endsWith(" ") ? ta.value + " " : ta.value;
    recognition.onstart = () => { $("voice-btn").classList.add("on"); $("voice-btn").textContent = "● listening"; };
    recognition.onresult = e => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) base += t; else interim += t;
      }
      ta.value = base + interim;
      ta.scrollTop = ta.scrollHeight;
    };
    recognition.onerror = e => {
      if (e.error === "not-allowed") showError("microphone access was blocked, so check your browser permissions");
      stopVoice();
    };
    recognition.onend = stopVoice;
    recognition.start();
  }
  function stopVoice() {
    if (recognition) { try { recognition.stop(); } catch (e) {} recognition = null; }
    $("voice-btn").classList.remove("on");
    $("voice-btn").textContent = "+ voice";
  }

  // ── START ─────────────────────────────────────────────
  session();
  $("sample-note").hidden = SORT_SOURCE !== "sample";
  (function restore() {
    const saved = load("sessionStorage", "bd-plan", null);
    if (saved && saved.result && saved.result.raw) {
      result = saved.result; done = saved.done || []; moved = saved.moved || [];
      level = result.level; anxious = result.anxious;
      if (SORT_SOURCE === "sample" && !ta.value) ta.value = SAMPLE_DUMP;
      Object.assign(result, checkPlan(result.raw, result.level, result.anxious));
      if (load("sessionStorage", "bd-view", "dump") === "plan") {
        open = { later: desktop.matches, let_go: false };
        showView("plan"); renderPlan(); setTimer(TIMER_MIN[result.level]);
        return;
      }
    }
    if (SORT_SOURCE === "sample" && !ta.value) ta.value = SAMPLE_DUMP;
    showView("dump");
  })();
</script>
</body>
</html>
